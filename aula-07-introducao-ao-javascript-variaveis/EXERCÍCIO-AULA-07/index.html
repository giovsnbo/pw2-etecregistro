<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 07</title>
  </head>
  <body></body>

  <script>

    //pedindo nome
    let nome = window.prompt("Digite seu nome");
    document.write(nome);

    //exibindo uma mensagem de alerta ao usuario
    window.alert("Bem-vindo " + nome + "!");

    let cidade = window.prompt("Digite sua cidade");
    //cidade = "São Paulo";
    document.write("<br>");
    document.write("Eu moro em " + cidade + "<br>");

    //const
    const idade = Number(window.prompt("Digite sua idade"));
    //conversao de dados: Number()
    document.write("Tenho " + idade + " anos! <br>");



  </script>
</html>
